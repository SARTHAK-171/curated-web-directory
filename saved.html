<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved · ORBIT</title>
  <meta name="description" content="Your locally saved resources from the curated web directory.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b8ff6a'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/explore.css">
  <link rel="stylesheet" href="assets/css/saved.css">
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/saved-page.js"></script>
</head>
<body data-page="saved" data-title="Saved">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="container explore-page saved-page">
      <section class="page-intro explore-intro" aria-labelledby="saved-heading">
        <p class="eyebrow enter">Your personal collection</p>
        <h1 class="enter" id="saved-heading" style="--i:1">Saved resources</h1>
        <p class="lead enter" style="--i:2">Keep useful discoveries close. Your list is stored in this browser on this device only.</p>
      </section>

      <section class="saved-directory" aria-label="Your saved resources">
        <div class="saved-toolbar">
          <label class="saved-search-field" for="saved-search">
            <span class="visually-hidden">Search saved resources</span>
            <span data-icon="search" aria-hidden="true"></span>
            <input id="saved-search" type="search" placeholder="Search your saved resources…" autocomplete="off">
          </label>
          <p class="results-count" id="saved-results-count" role="status" aria-live="polite">Loading saved resources…</p>
        </div>
        <div class="saved-categories" id="saved-categories" aria-label="Filter saved resources by category"></div>
        <div class="resource-grid" id="saved-results" aria-live="polite" aria-busy="true">
          <div class="directory-loading" aria-hidden="true">
            <span class="loading-dot"></span><span>Loading your saved collection</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
